[project]
name = "trackpulse-backend"
version = "0.1.0"
description = "TrackPulse -- AI pit wall copilot: live track-condition analysis, strategist recommendations, and a CrewAI synthesis agent"
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.15.14",
    "fastapi>=0.141.1",
    "fastf1>=3.8.3",
    "httpx>=0.28.1",
    "litellm>=1.96.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.52.1",
]
