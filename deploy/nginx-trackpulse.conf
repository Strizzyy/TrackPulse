server {
    listen 80;
    server_name 3.109.18.197.sslip.io;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 3.109.18.197.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/3.109.18.197.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.109.18.197.sslip.io/privkey.pem;

    # Video uploads (backend/app/main.py's /api/analyze etc.) can be sizable.
    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CLIP inference over up to 60 frames on a free-tier CPU is slow --
        # default 60s proxy timeouts would 504 a real analyze request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
