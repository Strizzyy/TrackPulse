# TrackPulse EC2 reverse proxy -- sits in front of uvicorn on :8000.
# Install to /etc/nginx/sites-available/trackpulse and symlink into
# sites-enabled (see deploy/AWS_DEPLOY.md).

server {
    listen 80 default_server;
    server_name _;

    # Lap videos are tens of MB; nginx's 1MB default rejects them with 413.
    client_max_body_size 300M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CLIP analysis of a full session takes up to ~2 minutes on CPU --
        # don't let nginx hang up before uvicorn answers.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
